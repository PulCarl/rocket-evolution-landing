name: Sync Discord member count

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Discord member count
        run: node scripts/sync-discord-stats.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet -- src/data/discordStats.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/discordStats.json
          git commit -m "Sync Discord member count"
          git push
